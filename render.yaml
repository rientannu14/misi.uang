services:
  - type: web
    name: misi-uang-kelas
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: TEACHER_NAME
        sync: false
      - key: TEACHER_USERNAME
        sync: false
      - key: TEACHER_PASSWORD
        sync: false
    disk:
      name: misi-uang-data
      mountPath: /var/data
      sizeGB: 1
